<!DOCTYPE html>
<html>
<head>
    <title>Your Reflections</title>
</head>
<body>
    <h1>Past Reflections</h1>
    {% if reflections %}
        <ul>
        {% for line in reflections %}
            <li>{{ line }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No reflections saved yet.</p>
    {% endif %}
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
<form action="/reset" method="POST">
    <button type="submit">Reset All Reflections</button>
</form>

<br>
<a href="/">Back to Home</a>
