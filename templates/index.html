<!DOCTYPE html>
<html>
<head>
    <title>Dhikr Reflection Journal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ dhikr.phrase }}</h1>
<p>{{ dhikr.meaning }}</p>

<form action="/reflect" method="POST">

    <input type="hidden" name="phrase" value="{{ dhikr.phrase }}">

    <label>Category:</label>

    <select name="category">
        <option>Gratitude</option>
        <option>Forgiveness</option>
        <option>Patience</option>
        <option>Hope</option>
        <option>Reliance</option>
        <option>Repentance</option>
        <option>Faith</option>
    </select>

    <br><br>

    <textarea
        name="reflection"
        placeholder="Write your reflection here">
    </textarea>

    <br>

    <button type="submit">
        Save Reflection
    </button>

</form>

    <br>
    <a href="/reflections">View Past Reflections</a>
</body>
</html>
